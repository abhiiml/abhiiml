<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="220" rx="20" fill="url(#bg)"/>

  <circle cx="35" cy="30" r="8" fill="#ff5f56"/>
  <circle cx="60" cy="30" r="8" fill="#ffbd2e"/>
  <circle cx="85" cy="30" r="8" fill="#27c93f"/>

  <text x="110" y="36"
        font-family="Consolas, monospace"
        font-size="18"
        fill="#8b949e">
    ~/README.md
  </text>

  <text x="60"
        y="95"
        font-family="Consolas, monospace"
        font-size="42"
        font-weight="bold"
        fill="url(#title)"
        filter="url(#glow)">
    Hi, I'm Abhijit Pandey 👋
  </text>

  <text x="60"
        y="135"
        font-family="Consolas, monospace"
        font-size="24"
        fill="#58A6FF">
    AI • Machine Learning • Full Stack Developer
  </text>

  <text x="60"
        y="175"
        font-family="Consolas, monospace"
        font-size="18"
        fill="#8b949e">
    Building intelligent applications • Learning every day • Open Source
  </text>

</svg>
