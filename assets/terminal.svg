<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="820"
    height="760"
    viewBox="0 0 820 760">

<defs>

<linearGradient id="terminalBG"
    x1="0%"
    y1="0%"
    x2="100%"
    y2="100%">

    <stop offset="0%" stop-color="#161B22"/>
    <stop offset="100%" stop-color="#0D1117"/>

</linearGradient>

<linearGradient id="titleGradient"
    x1="0%"
    y1="0%"
    x2="100%"
    y2="0%">

    <stop offset="0%" stop-color="#00E676"/>
    <stop offset="100%" stop-color="#00C853"/>

</linearGradient>

<filter id="glow">

    <feGaussianBlur
        stdDeviation="2"
        result="blur"/>

    <feMerge>

        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

    </feMerge>

</filter>

<style>

.background{
fill:url(#terminalBG);
stroke:#30363D;
stroke-width:2;
}

.heading{
fill:url(#titleGradient);
font-size:24px;
font-weight:bold;
font-family:Consolas,Monaco,monospace;
}

.label{
fill:#FFB454;
font-size:18px;
font-family:Consolas,Monaco,monospace;
}

.value{
fill:#58A6FF;
font-size:18px;
font-family:Consolas,Monaco,monospace;
}

.separator{
stroke:#30363D;
stroke-width:1;
}

.small{
fill:#8B949E;
font-size:16px;
font-family:Consolas,Monaco,monospace;
}

</style>

</defs>

