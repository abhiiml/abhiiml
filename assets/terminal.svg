<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Abhijit Pandey Developer Terminal</title>
<desc id="desc">GitHub dark terminal showing Abhijit Pandey's developer profile, skills, and current focus.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity=".45"/>
  </filter>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#161b22"/>
    <stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
</defs>

<rect x="8" y="8" width="884" height="544" rx="18" fill="url(#bg)" stroke="#30363d" stroke-width="2" filter="url(#shadow)"/>
<rect x="8" y="8" width="884" height="58" rx="18" fill="#161b22"/>
<path d="M8 66H892" stroke="#30363d" stroke-width="2"/>

<circle cx="39" cy="37" r="9" fill="#ff5f56"/>
<circle cx="68" cy="37" r="9" fill="#ffbd2e"/>
<circle cx="97" cy="37" r="9" fill="#27c93f"/>

<text x="135" y="43" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" fill="#8b949e">abhiiml@github</text>
<text x="830" y="43" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" fill="#8b949e">⌘</text>

<text x="42" y="101" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" fill="#39ff88">$ whoami</text>
<text x="42" y="128" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="19" fill="#58a6ff">Abhijit Pandey</text>

<text x="42" y="165" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" fill="#39ff88">$ role</text>
<text x="42" y="192" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" fill="#58a6ff">B.Tech CSE (AI/ML)</text>

<text x="42" y="229" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" fill="#39ff88">$ location</text>
<text x="42" y="256" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" fill="#58a6ff">India</text>

<text x="42" y="293" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" fill="#39ff88">$ focus</text>
<text x="42" y="320" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" fill="#f0883e">Artificial Intelligence</text>
<text x="42" y="346" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" fill="#f0883e">Machine Learning</text>
<text x="42" y="372" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" fill="#f0883e">Python • Data Science</text>

<path d="M42 397H858" stroke="#30363d"/>
<text x="42" y="425" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" fill="#39ff88">$ tools</text>
<text x="42" y="452" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" fill="#58a6ff">Python • C++ • Java • JavaScript</text>
<text x="42" y="478" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" fill="#58a6ff">Git • GitHub • VS Code • Linux</text>

<text x="42" y="514" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" fill="#39ff88">$ status</text>
<text x="145" y="514" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" fill="#f0883e">learning → building → improving</text>

<rect x="820" y="91" width="38" height="38" rx="8" fill="#21262d" stroke="#30363d"/>
<rect x="831" y="102" width="16" height="14" rx="2" fill="none" stroke="#8b949e" stroke-width="2"/>
<rect x="827" y="98" width="16" height="14" rx="2" fill="none" stroke="#8b949e" stroke-width="2"/>
</svg>
